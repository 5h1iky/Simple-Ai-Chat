plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 发布签名：读取本地 keystore.properties（不入库，缺失时 release 退化为未签名）
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'www.cetool.com'
    compileSdk 36

    defaultConfig {
        applicationId 'www.cetool.com'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '2.0.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    // Compose 编译器版本：与 Kotlin 1.9.24 匹配的旧式编译器（版本已实测存在于阿里云/官方镜像）
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'

    // OkHttp + Gson 用于调用 AI API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // RecyclerView 用于聊天消息列表
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Markwon 用于渲染 Markdown
    implementation 'io.noties.markwon:core:4.6.2'

    // DrawerLayout
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ─── Jetpack Compose（版本已实测验证，见 UPGRADE_PLAN.md §7.3） ───
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    // 图片加载（Compose 版）
    implementation 'io.coil-kt:coil-compose:2.7.0'
    // Material Icons 扩展图标库（版本由 BOM 2024.09.00 锁定为 1.7.0，镜像实测可达）
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
